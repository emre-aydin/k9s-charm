name: k9s
base: ubuntu@26.04
version: "0.51.0"
summary: k9s terminal UI for Kubernetes
description: |
  A rock containing k9s, a terminal UI to interact with Kubernetes clusters,
  together with an interactive zsh shell.

  It is intended to be used as the workload container of a Juju sidecar charm
  so that operators can drop into a shell and run k9s against the cluster the
  charm is deployed on.
license: Apache-2.0

platforms:
  amd64:
  arm64:

environment:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TERM: xterm-256color
  KUBECONFIG: /root/.kube/config
  # Read by /bin/sh (dash) for interactive shells; /root/.shinit execs zsh.
  # This is what makes `juju ssh --container k9s <unit>` land in zsh, since
  # Juju starts /bin/sh directly and ignores the login shell in /etc/passwd.
  ENV: /root/.shinit

# The rock is a long-running workload container: keep it alive so that an
# interactive session can be started with `pebble exec -it /usr/bin/zsh`.
services:
  k9s:
    override: replace
    command: sleep infinity
    startup: enabled

parts:
  k9s:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
    override-build: |
      set -eu

      K9S_VERSION="$(craftctl get version)"
      case "${CRAFT_ARCH_BUILD_FOR}" in
        amd64) K9S_SHA256="c3752ad51a5a4015a113819c4eeb6e55a4d0e4b8e652494797532f6fc8161dd7" ;;
        arm64) K9S_SHA256="3ee05c82e5f9198928a4e86133608ba6a2c10a2244d6a7789e820f78319d640c" ;;
        *) echo "unsupported architecture: ${CRAFT_ARCH_BUILD_FOR}" >&2; exit 1 ;;
      esac

      TARBALL="k9s_Linux_${CRAFT_ARCH_BUILD_FOR}.tar.gz"
      curl --fail --location --silent --show-error \
        --output "${TARBALL}" \
        "https://github.com/derailed/k9s/releases/download/v${K9S_VERSION}/${TARBALL}"
      echo "${K9S_SHA256}  ${TARBALL}" | sha256sum --check --strict -

      tar --extract --gzip --file "${TARBALL}" k9s
      install -D -m 0755 k9s "${CRAFT_PART_INSTALL}/usr/bin/k9s"

  kubectl:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
    override-build: |
      set -eu

      KUBECTL_VERSION="v1.37.0"
      case "${CRAFT_ARCH_BUILD_FOR}" in
        amd64) KUBECTL_SHA256="6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f" ;;
        arm64) KUBECTL_SHA256="922df28df248cc00a9e025f947704f1d1482de64ece54cfe57e61f19eaf1eef3" ;;
        *) echo "unsupported architecture: ${CRAFT_ARCH_BUILD_FOR}" >&2; exit 1 ;;
      esac

      curl --fail --location --silent --show-error \
        --output kubectl \
        "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${CRAFT_ARCH_BUILD_FOR}/kubectl"
      echo "${KUBECTL_SHA256}  kubectl" | sha256sum --check --strict -

      install -D -m 0755 kubectl "${CRAFT_PART_INSTALL}/usr/bin/kubectl"

  shell:
    plugin: nil
    after: [k9s, kubectl]
    overlay-packages:
      - bash
      - bash-completion
      - ca-certificates
      - less
      - locales
      - ncurses-term
      - vim-tiny
      - zsh
    overlay-script: |
      set -eu
      # Make zsh the login shell for root so interactive sessions land in zsh.
      sed -i 's|^root:\(.*\):/bin/[a-z]*$|root:\1:/usr/bin/zsh|' "${CRAFT_OVERLAY}/etc/passwd"
      # /etc/zsh/zshenv already ships with the zsh package; append our
      # defaults rather than replacing the file outright.
      cat "${CRAFT_PROJECT_DIR}/files/zshenv" >> "${CRAFT_OVERLAY}/etc/zsh/zshenv"

  shell-config:
    plugin: dump
    after: [shell]
    source: files
    organize:
      zshrc: root/.zshrc
      shinit: root/.shinit
    stage:
      - root/.zshrc
      - root/.shinit
    # Without this the files inherit the build user's group, which varies
    # between builds (root:nogroup vs root:root).
    permissions:
      - path: root/.zshrc
        owner: 0
        group: 0
        mode: "644"
      - path: root/.shinit
        owner: 0
        group: 0
        mode: "644"
